<main class="login-main">
  <section class="login-card" aria-labelledby="login-heading">
    <div class="login-logo" role="img" aria-label="DESS">
      <span class="logo-symbol" aria-hidden="true"></span>
      <span class="logo-wordmark" aria-hidden="true"></span>
    </div>

    <h2 class="company-name">DESS DIGITAL MEETINGS</h2>

    <h1 id="login-heading">LOGIN</h1>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-field">
        <label for="username">Username</label>
        <input
          id="username"
          name="username"
          type="text"
          formControlName="username"
          placeholder="Username"
          autocomplete="username"
          required
        />
        @if (username.touched && username.hasError('required')) {
          <small class="field-error">Username is required.</small>
        }
      </div>

      <div class="form-field">
        <label for="password">Password</label>
        <div class="password-input">
          <input
            id="password"
            name="password"
            [type]="showPassword ? 'text' : 'password'"
            formControlName="password"
            placeholder="Password"
            autocomplete="current-password"
            required
          />
          <button
            type="button"
            class="eye-button"
            (click)="showPassword = !showPassword"
            [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              aria-hidden="true"
            >
              <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          </button>
        </div>
        @if (password.touched && password.hasError('required')) {
          <small class="field-error">Password is required.</small>
        }
      </div>

      @if (error()) {
        <p class="field-error" role="alert">{{ error() }}</p>
      }
      <button class="sign-in-button" type="submit" [disabled]="loading()">
        {{ loading() ? 'Signing in…' : 'Sign In' }}
      </button>
    </form>
  </section>
</main>

<footer class="login-footer">
  <span>
    © 2026 Copyright:
    <a href="https://www.dess.net/" target="_blank" rel="noopener noreferrer">
      Dess Technologies Pvt. Ltd.
    </a>
  </span>
</footer>
